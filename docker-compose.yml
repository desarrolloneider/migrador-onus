# Stack completo del monorepo. Lee las claves de .env (copiar .env.example).
#
#   docker compose up -d postgres         solo la base, para desarrollar el backend desde el IDE
#   docker compose up -d --build          todo: base, proceso web, proceso ejecutor y frontend en http://127.0.0.1:47843
#
# Puertos del equipo anfitrión (poco usados, para no chocar con otros contenedores del servidor), cambiables en el .env:
#   página web  MIGRADOR_PUERTO_FRONTEND  47843
#   API         MIGRADOR_PUERTO_WEB       47880
#   PostgreSQL  MIGRADOR_PUERTO_BD        47432
# Por defecto solo escuchan en 127.0.0.1 (arquitectura 11.1). Para abrir la página a la red del servidor:
# MIGRADOR_IP_PUBLICACION=0.0.0.0. La API (MIGRADOR_IP_API) y la base (MIGRADOR_IP_BD) solo se abren si de verdad hace
# falta: la página llega a la API por dentro de Docker.
#
# Imágenes: guajiranet/migrador-onu-{api,ejecutor,web}:<versión>. La versión sale de MIGRADOR_VERSION en el .env.
# El nombre del proyecto (COMPOSE_PROJECT_NAME=migrador-onu en el .env) fija los volúmenes de la base de datos.
# Va en el .env y no aquí para que funcione también con docker-compose 1.x.

services:
  postgres:
    image: postgres:17
    container_name: migrador-onu-bd
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD:?Falta POSTGRES_SUPERUSER_PASSWORD en .env}
      MIGRADOR_OWNER_PASSWORD: ${DATABASE_OWNER_PASSWORD:?Falta DATABASE_OWNER_PASSWORD en .env}
      MIGRADOR_APP_PASSWORD: ${DATABASE_APP_PASSWORD:?Falta DATABASE_APP_PASSWORD en .env}
    ports:
      - "${MIGRADOR_IP_BD:-127.0.0.1}:${MIGRADOR_PUERTO_BD:-47432}:5432"
    volumes:
      - migrador-pg:/var/lib/postgresql/data
      - ./docs/base-datos/inicializar-roles.sh:/docker-entrypoint-initdb.d/01-inicializar-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d migrador"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend-web:
    image: guajiranet/migrador-onu-api:${MIGRADOR_VERSION:-1.0.0}
    container_name: migrador-onu-api
    build:
      context: ./backend
      target: web
      args:
        REGISTRO: ${REGISTRO:-}
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/migrador
      AUDITORIA_ANCLAS_DIR: /var/lib/migrador/anclas
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MIGRADOR_IP_API:-127.0.0.1}:${MIGRADOR_PUERTO_WEB:-47880}:8080"
    volumes:
      - migrador-anclas:/var/lib/migrador/anclas
    healthcheck:
      # /dev/tcp es de bash: la imagen no trae curl ni wget.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q UP <&3"]
      interval: 10s
      timeout: 5s
      retries: 12

  backend-worker:
    image: guajiranet/migrador-onu-ejecutor:${MIGRADOR_VERSION:-1.0.0}
    container_name: migrador-onu-ejecutor
    build:
      context: ./backend
      target: worker
      args:
        REGISTRO: ${REGISTRO:-}
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/migrador
      AUDITORIA_ANCLAS_DIR: /var/lib/migrador/anclas
    depends_on:
      backend-web:
        condition: service_healthy
    # Un solo proceso ejecutor (RN-40): no escalar este servicio.
    volumes:
      - migrador-anclas:/var/lib/migrador/anclas
    restart: unless-stopped

  frontend:
    image: guajiranet/migrador-onu-web:${MIGRADOR_VERSION:-1.0.0}
    container_name: migrador-onu-web
    build:
      context: ./frontend
      args:
        # Vacío = Docker Hub. Si Docker Hub falla: REGISTRO=mirror.gcr.io/library/
        REGISTRO: ${REGISTRO:-}
    environment:
      BACKEND_URL: http://backend-web:8080
    depends_on:
      backend-web:
        condition: service_healthy
    ports:
      - "${MIGRADOR_IP_PUBLICACION:-127.0.0.1}:${MIGRADOR_PUERTO_FRONTEND:-47843}:80"

volumes:
  migrador-pg:
  migrador-anclas:
